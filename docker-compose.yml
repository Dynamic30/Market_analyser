# Local dev infrastructure — Postgres (relational) and MongoDB (documents),
# plus a browser UI for Mongo.
#
# The FastAPI app and the Scripts/ pipeline still run on the host; no Dockerfile
# needed for that yet. Both databases keep their data in named volumes, so a
# `down` is safe and only `down -v` destroys anything.
#
#   docker compose up -d       start
#   docker compose down        stop (data kept)
#   docker compose down -v     stop and WIPE all database data
#
# After starting, set these in .env:
#   SQL_DB="postgresql+psycopg://market:market@localhost:5432/market_analyser"
#   DATABASE="mongodb://localhost:27017"

services:
  postgres:
    image: postgres:16
    container_name: market_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_analyser
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_analyser"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: market_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Compose waits for this before reporting the service healthy, so
      # mongo-express doesn't start against a Mongo that isn't listening yet.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional web UI at http://localhost:8080 — the Postgres counterpart to
  # mongo-express, for browsing the stocks and stock_analysis tables.
  # Login: System "PostgreSQL", Server "postgres", user/password/db all "market".
  adminer:
    image: adminer:5
    container_name: market_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Optional web UI at http://localhost:8081 — useful for eyeballing the
  # Financial_Data and Sentiments collections the pipeline writes.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: market_mongo_ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
