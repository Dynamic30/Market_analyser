<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commodities — Market Analyser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --accent:#0ea5e9; --accent2:#14b8a6;
    --bull:#16a34a; --bull-bg:#dcfce7; --bear:#dc2626; --bear-bg:#fee2e2;
    --neutral:#64748b; --neutral-bg:#f1f5f9;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  }
  [data-theme="dark"]{
    --bg:#0b1220; --surface:#161e2e; --surface2:#1e293b;
    --text:#f1f5f9; --muted:#94a3b8; --border:#253044;
    --accent:#38bdf8; --accent2:#2dd4bf;
    --bull:#34d399; --bull-bg:#052e2b; --bear:#f87171; --bear-bg:#3b1113;
    --neutral:#94a3b8; --neutral-bg:#1e293b;
    --shadow:0 1px 3px rgba(0,0,0,.3);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --surface:#faf4e1; --surface2:#efe6cd;
    --text:#43382b; --muted:#8a7a63; --border:#e5d9bf;
    --accent:#b45309; --accent2:#0e7490;
    --bull:#4d7c0f; --bull-bg:#e8efd6; --bear:#b91c1c; --bear-bg:#f3ddd5;
    --neutral:#8a7a63; --neutral-bg:#efe6cd;
    --shadow:0 1px 3px rgba(120,90,40,.12);
    --shadow-lg:0 12px 34px rgba(120,90,40,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .logo .mark{width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;font-size:15px}
  .theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:7px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s}
  .theme-btn:hover{background:var(--surface2)}

  /* title block */
  .title-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .sub b{color:var(--text)}

  /* filter chips */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .chip:hover{color:var(--text)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}

  /* group */
  .group-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 12px}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;
    padding:16px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cmd{display:flex;align-items:center;gap:10px}
  .cmd .emoji{width:38px;height:38px;border-radius:10px;background:var(--surface2);
    display:grid;place-items:center;font-size:19px}
  .cmd .nm{font-weight:700;font-size:15px;line-height:1.15}
  .cmd .sym{font-size:11.5px;color:var(--muted);font-weight:500}
  .bias{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .bias.bull{color:var(--bull);background:var(--bull-bg)}
  .bias.bear{color:var(--bear);background:var(--bear-bg)}
  .bias.neutral{color:var(--neutral);background:var(--neutral-bg)}
  .price-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
  .price{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .price .unit{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
  .chg{font-size:13.5px;font-weight:700}
  .chg.up{color:var(--bull)} .chg.down{color:var(--bear)}
  .inr{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .driver{font-size:12.5px;color:var(--muted);line-height:1.4;
    border-top:1px solid var(--border);padding-top:10px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;
    width:100%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);position:relative}
  .modal-in{padding:22px}
  .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:16px}
  .x:hover{background:var(--surface2);color:var(--text)}
  .m-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .m-head .emoji{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px}
  .m-head .nm{font-size:19px;font-weight:800}
  .m-head .sym{font-size:12px;color:var(--muted)}
  .m-price{display:flex;align-items:flex-end;gap:10px;margin:14px 0 4px}
  .m-price .p{font-size:28px;font-weight:800}
  .m-inr{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--surface2);border-radius:11px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:14.5px;font-weight:700;margin-top:2px}
  .llm-card{border-radius:13px;padding:14px;margin-bottom:14px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),color-mix(in srgb,var(--accent2) 10%,var(--surface)));
    border:1px solid var(--border)}
  .llm-card .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .llm-card p{font-size:13.5px;line-height:1.55}
  .sec-lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .risks{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
  .risks li{font-size:13px;line-height:1.45;padding-left:20px;position:relative;color:var(--text)}
  .risks li::before{content:"⚠";position:absolute;left:0;top:0;font-size:12px;color:var(--bear)}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
  @media(max-width:520px){.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <header>
    <div class="logo"><span class="mark">◈</span> Market Analyser</div>
    <button class="theme-btn" id="themeBtn">☀ Light</button>
  </header>

  <div class="title-row">
    <h1>Commodities</h1>
  </div>
  <div class="sub">
    Today <b>Sunday, 21 Jun 2026</b> · Showing analysis for <b>Friday, 19 Jun 2026</b> (last session).

  </div>

  <div class="filters" id="filters">

    <button class="chip" data-cat="Metals">Metals</button>
    <button class="chip" data-cat="Energy">Energy</button>
    <button class="chip" data-cat="Agriculture">Agriculture</button>

  </div>

  <div id="groups"></div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="x" id="closeX">✕</button>
    <div class="modal-in" id="modalBody"></div>
  </div>
</div>

/* ---- render ---- */
const CATS = ['Metals','Energy','Agriculture','Livestock'];
const groupsEl = document.getElementById('groups');

function biasLabel(b){return b==='bull'?'Bullish':b==='bear'?'Bearish':'Neutral';}

function render(filter='all'){
  groupsEl.innerHTML='';
  const cats = filter==='all' ? CATS : [filter];
  cats.forEach(cat=>{
    const items = DATA.filter(d=>d.cat===cat);
    if(!items.length) return;
    const lab=document.createElement('div'); lab.className='group-label'; lab.textContent=cat;
    groupsEl.appendChild(lab);
    const grid=document.createElement('div'); grid.className='grid';
    items.forEach(d=>{
      const up=d.chg>=0;
      let inrLine='';
      if(d.sym==='GC=F') inrLine=`<div class="inr">≈ ₹${fmt(inrPer10gGold(d.price))} / 10g</div>`;
      if(d.sym==='SI=F') inrLine=`<div class="inr">≈ ₹${fmt(inrPerKgSilver(d.price))} / kg</div>`;
      const card=document.createElement('div'); card.className='card';
      card.innerHTML=`
        <div class="card-top">
          <div class="cmd">
            <div class="emoji">${d.emoji}</div>
            <div><div class="nm">${d.name}</div><div class="sym">${d.sym}</div></div>
          </div>
          <div class="bias ${d.bias}">${biasLabel(d.bias)}</div>
        </div>
        <div class="price-row">
          <div class="price">${d.price<10?d.price.toFixed(2):fmt(d.price)}<span class="unit">${d.unit}</span></div>
          <div class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(d.chg).toFixed(1)}%</div>
        </div>
        ${inrLine}
        <div class="driver">${d.driver}</div>`;
      card.onclick=()=>openModal(d);
      grid.appendChild(card);
    });
    groupsEl.appendChild(grid);
  });
}

/* ---- modal ---- */
const overlay=document.getElementById('overlay');
const modalBody=document.getElementById('modalBody');
function openModal(d){
  const up=d.chg>=0;
  let inrLine='';
  if(d.sym==='GC=F') inrLine=`≈ ₹${fmt(inrPer10gGold(d.price))} / 10g (MCX-equivalent)`;
  if(d.sym==='SI=F') inrLine=`≈ ₹${fmt(inrPerKgSilver(d.price))} / kg (MCX-equivalent)`;
  modalBody.innerHTML=`
    <div class="m-head">
      <div class="emoji">${d.emoji}</div>
      <div><div class="nm">${d.name}</div><div class="sym">${d.sym} · ${d.cat}</div></div>
    </div>
    <div class="m-price">
      <div class="p">${d.price<10?d.price.toFixed(2):fmt(d.price)}<span class="unit" style="font-size:14px;color:var(--muted)"> USD${d.unit}</span></div>
      <div class="chg ${up?'up':'down'}" style="font-size:16px">${up?'▲':'▼'} ${Math.abs(d.chg).toFixed(1)}%</div>
    </div>
    ${inrLine?`<div class="m-inr">${inrLine}</div>`:'<div style="height:6px"></div>'}
    <div class="stat-grid">
      <div class="stat"><div class="k">Trend</div><div class="v">${d.trend}</div></div>
      <div class="stat"><div class="k">RSI (14)</div><div class="v">${d.rsi}</div></div>
      <div class="stat"><div class="k">Day range</div><div class="v">${d.dayRange}</div></div>
      <div class="stat"><div class="k">52-week range</div><div class="v">${d.range52}</div></div>
    </div>
    <div class="llm-card">
      <div class="lab">LLM Analysis · ${biasLabel(d.bias)}</div>
      <p>${d.analysis}</p>
    </div>
    <div class="sec-lab">Key Risks</div>
    <ul class="risks">${d.risks.map(r=>`<li>${r}</li>`).join('')}</ul>
    <div class="note">Price data: Yahoo Finance futures (${d.sym}), USD. Commodity analysis is driven by
      macro factors (rates, USD, supply/demand, geopolitics) — not company fundamentals.</div>`;
  overlay.classList.add('open');
}
document.getElementById('closeX').onclick=()=>overlay.classList.remove('open');
overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open');};

/* ---- filters ---- */
document.getElementById('filters').addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  render(chip.dataset.cat);
});

/* ---- theme cycle (matches your dashboard) ---- */
const themes=[['light','☀ Light'],['dark','☾ Dark'],['sepia','☕ Sepia']];
let ti=0;
const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{ti=(ti+1)%themes.length;document.body.dataset.theme=themes[ti][0];themeBtn.textContent=themes[ti][1];};

render();
</script>
</body>
</html>
